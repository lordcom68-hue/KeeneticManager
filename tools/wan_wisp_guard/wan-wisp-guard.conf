# Keenetic WAN/WISP Guard configuration.
# Verify every interface identifier before setting DRY_RUN=0.

PING_PROFILE='WAN_GUARD'

# Logical wired Internet interface to which the Ping Check profile is attached.
# For the router inspected during development this was GigabitEthernet1.
WIRED_IF='GigabitEthernet1'

# Previously configured Wireless ISP connection.
WISP_IF='WifiMaster0/WifiStation0'

# Access points that must broadcast only while wired Internet is available.
# Add other AccessPoint interfaces here if guest or additional networks must
# follow the same automation.
AP_LIST='WifiMaster0/AccessPoint0 WifiMaster1/AccessPoint0'

# This only controls how often the local service reads the native Ping Check
# result. Actual Internet probes are configured in KeeneticOS: every 10 seconds,
# 5 failed probes to enter backup mode and 2 successful probes to recover.
POLL_SECONDS=2
RETRY_SECONDS=10
BOOT_GRACE_SECONDS=60

# Keep this enabled for the first test. Set to 0 only after checking the log.
DRY_RUN=1

LOG_FILE='/opt/var/log/wan-wisp-guard.log'
STATE_FILE='/tmp/wan-wisp-guard.state'
LOG_LIMIT_BYTES=65536
