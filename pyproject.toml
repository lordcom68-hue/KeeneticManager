[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "clean_backups",
    "backups",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["core", "ui"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
