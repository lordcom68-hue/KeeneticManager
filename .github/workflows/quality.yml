name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt
            constraints-release.txt

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            -r requirements.txt `
            -r requirements-build.txt `
            -r requirements-dev.txt `
            -c constraints-release.txt
          python -m pip check

      - name: Run quality checks
        shell: pwsh
        run: ./tools/quality_check.ps1 -Python python

      - name: Verify clean source export
        shell: pwsh
        run: |
          ./tools/build_release_source.ps1 `
            -OutputRoot $env:RUNNER_TEMP `
            -Python python `
            -SkipQualityChecks

      - name: Build and smoke-test portable application
        shell: pwsh
        run: |
          ./tools/build_release.ps1 `
            -Python python `
            -SkipInstaller `
            -SkipQualityChecks
